<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#166b5c">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="初一（9）班专用工具——证件照压缩">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' blob: data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='5' width='44' height='54' rx='9' fill='%23fff' stroke='%23166b5c' stroke-width='4'/%3E%3Crect x='20' y='16' width='24' height='16' rx='4' fill='%23e7f3ef'/%3E%3Cpath d='M20 41h24M20 49h24' stroke='%23166b5c' stroke-width='4'/%3E%3C/svg%3E">
  <title>初一（9）班专用工具——证件照压缩</title>
  <style>
    :root {
      --page: #f3f7f5;
      --surface: #ffffff;
      --surface-soft: #f7faf8;
      --ink: #17231f;
      --muted: #64716c;
      --line: #d8e2dd;
      --primary: #166b5c;
      --primary-hover: #10574b;
      --primary-soft: #e7f3ef;
      --success: #157347;
      --success-soft: #eaf6ef;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --warning: #8a4b08;
      --warning-soft: #fff7e8;
      --focus: #70c5b3;
      --radius: 14px;
      --shadow: 0 18px 50px rgba(25, 54, 45, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .upload-box,
    .download-link {
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      width: min(100% - 28px, 680px);
      margin: 0 auto;
      padding: 36px 0 30px;
    }

    .masthead {
      margin-bottom: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-mark {
      position: relative;
      flex: 0 0 auto;
      width: 42px;
      height: 48px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: var(--surface);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      top: 9px;
      height: 12px;
      border-radius: 4px;
      background: var(--primary-soft);
      border: 1px solid #b5d9cf;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 9px;
      height: 8px;
      border-top: 2px solid var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .privacy-strip {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      padding: 11px 13px;
      color: #31564c;
      background: var(--primary-soft);
      border: 1px solid #cce4dd;
      border-radius: 10px;
      font-size: 14px;
    }

    .shield {
      position: relative;
      flex: 0 0 auto;
      width: 17px;
      height: 19px;
      margin-top: 1px;
      background: var(--primary);
      clip-path: polygon(50% 0, 100% 18%, 92% 70%, 50% 100%, 8% 70%, 0 18%);
    }

    .shield::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 5px;
      width: 4px;
      height: 7px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .panel {
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .field-group + .field-group {
      margin-top: 26px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    .field-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: 700;
    }

    .step-number {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      color: #fff;
      background: var(--primary);
      border-radius: 50%;
      font-size: 14px;
    }

    .required {
      color: var(--danger);
    }

    .id-input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #aebdb6;
      border-radius: 9px;
      outline: none;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 17px;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .id-input:hover {
      border-color: #80958b;
    }

    .id-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 107, 92, 0.14);
    }

    .id-input[aria-invalid="true"] {
      border-color: var(--danger);
    }

    .field-hint {
      min-height: 22px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .field-hint.is-error {
      color: var(--danger);
    }

    .field-hint.is-valid {
      color: var(--success);
      font-weight: 600;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .upload-box {
      display: grid;
      justify-items: center;
      min-height: 148px;
      padding: 24px 18px;
      color: var(--ink);
      background: var(--surface-soft);
      border: 2px dashed #a9beb5;
      border-radius: 11px;
      cursor: pointer;
      text-align: center;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .upload-box:hover,
    .upload-box.is-dragging {
      background: #edf7f3;
      border-color: var(--primary);
    }

    .file-input:focus-visible + .upload-box {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .upload-icon {
      position: relative;
      width: 34px;
      height: 28px;
      margin-bottom: 11px;
      border: 2px solid var(--primary);
      border-radius: 5px;
    }

    .upload-icon::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 7px;
      width: 8px;
      height: 8px;
      border-left: 2px solid var(--primary);
      border-top: 2px solid var(--primary);
      transform: rotate(45deg);
    }

    .upload-icon::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 7px;
      width: 2px;
      height: 15px;
      background: var(--primary);
    }

    .upload-title {
      font-weight: 700;
    }

    .upload-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-card {
      display: none;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      margin-top: 14px;
      padding: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .preview-card.is-visible {
      display: grid;
    }

    .preview-image-wrap {
      display: grid;
      place-items: center;
      width: 92px;
      height: 112px;
      overflow: hidden;
      background: #e6ece9;
      border: 1px solid #ccd8d2;
      border-radius: 7px;
    }

    .preview-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .file-name {
      margin: 0 0 5px;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .file-detail {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .replace-button {
      min-height: 44px;
      margin-top: 8px;
      padding: 7px 0;
      color: var(--primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .primary-button {
      width: 100%;
      min-height: 54px;
      margin-top: 24px;
      padding: 13px 18px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 150ms ease, transform 100ms ease;
    }

    .primary-button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .primary-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .primary-button:disabled {
      color: #87918d;
      background: #dfe5e2;
      cursor: not-allowed;
    }

    .primary-button.is-busy {
      cursor: wait;
    }

    .primary-button:focus-visible,
    .replace-button:focus-visible,
    .download-link:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .alert {
      display: none;
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 14px;
    }

    .alert.is-visible {
      display: block;
    }

    .alert.is-error {
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #f2c8c4;
    }

    .alert.is-info {
      color: #31564c;
      background: var(--primary-soft);
      border: 1px solid #cce4dd;
    }

    .result-card {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: var(--success-soft);
      border: 1px solid #bde1ca;
      border-radius: 10px;
    }

    .result-card.is-visible {
      display: block;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 7px;
      color: var(--success);
      font-weight: 800;
    }

    .check-mark {
      position: relative;
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      background: var(--success);
      border-radius: 50%;
    }

    .check-mark::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 4px;
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .result-meta,
    .result-note {
      margin: 0;
      color: #355449;
      font-size: 14px;
    }

    .result-filename {
      overflow-wrap: anywhere;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-weight: 700;
    }

    .download-link,
    .share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 13px;
      padding: 9px 16px;
      color: #fff;
      background: var(--success);
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 13px;
    }

    .result-actions .download-link,
    .result-actions .share-button {
      margin-top: 0;
    }

    .share-button {
      border: 0;
      cursor: pointer;
    }

    .share-button[hidden] {
      display: none;
    }

    .result-note {
      margin-top: 10px;
      color: var(--warning);
      font-size: 12px;
    }

    .help-box {
      margin-top: 16px;
      padding: 14px 16px;
      color: #5e5141;
      background: var(--warning-soft);
      border: 1px solid #ead9b7;
      border-radius: 10px;
      font-size: 13px;
    }

    .help-box strong {
      color: #72400b;
    }

    .footer {
      padding: 18px 8px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .noscript {
      margin: 18px auto;
      padding: 14px;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #f2c8c4;
      border-radius: 10px;
    }

    @media (max-width: 480px) {
      .page-shell {
        width: min(100% - 20px, 680px);
        padding-top: 22px;
      }

      .panel {
        padding: 20px 16px;
      }

      .preview-card {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .preview-image-wrap {
        width: 76px;
        height: 96px;
      }
    }

    @media (min-width: 768px) {
      .page-shell {
        padding-top: 48px;
      }

      .panel {
        padding: 32px;
      }
    }

    @media (min-width: 1024px) {
      .page-shell {
        width: 720px;
      }
    }

    @media (min-width: 1440px) {
      .page-shell {
        padding-top: 64px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto;
        transition-duration: 0.01ms;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .panel {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>初一（9）班专用工具——证件照压缩</h1>
      </div>
      <p class="subtitle">自动压到 200KB 以下，并按孩子的身份证号命名。</p>
      <div class="privacy-strip" role="note">
        <span class="shield" aria-hidden="true"></span>
        <span><strong>隐私安全：</strong>照片和身份证号只在当前设备处理，不会上传到网络，也不会保存到本工具。</span>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="tool-title">
        <h2 id="tool-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">压缩并命名证件照</h2>

        <div class="field-group">
          <label class="field-heading" for="idNumber">
            <span class="step-number" aria-hidden="true">1</span>
            <span>填写孩子的身份证号 <span class="required" aria-hidden="true">*</span></span>
          </label>
          <input
            class="id-input"
            id="idNumber"
            name="idNumber"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="18"
            placeholder="18 位身份证号，末位 X 请直接输入"
            aria-describedby="idHint"
            aria-required="true"
            aria-invalid="false"
          >
          <p class="field-hint" id="idHint">下载后的文件名将是：身份证号.jpg</p>
        </div>

        <div class="field-group">
          <div class="field-heading" id="photoLabel">
            <span class="step-number" aria-hidden="true">2</span>
            <span>选择孩子的证件照 <span class="required" aria-hidden="true">*</span></span>
          </div>
          <input class="file-input" id="photoInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.bmp,.heic,.heif" aria-labelledby="photoLabel uploadText">
          <label class="upload-box" id="uploadBox" for="photoInput">
            <span class="upload-icon" aria-hidden="true"></span>
            <span class="upload-title" id="uploadText">点击选择照片</span>
            <span class="upload-note">支持常见照片格式，单张不超过 50MB</span>
          </label>

          <div class="preview-card" id="previewCard" aria-live="polite">
            <div class="preview-image-wrap">
              <img class="preview-image" id="previewImage" alt="已选择证件照的预览">
            </div>
            <div>
              <p class="file-name" id="fileName"></p>
              <p class="file-detail" id="fileDetail"></p>
              <button class="replace-button" id="replaceButton" type="button">重新选择照片</button>
            </div>
          </div>
        </div>

        <button class="primary-button" id="compressButton" type="button" disabled>请先填写身份证号并选择照片</button>

        <div class="alert" id="alertBox" role="status" aria-live="polite"></div>

        <div class="result-card" id="resultCard" aria-live="polite">
          <p class="result-title"><span class="check-mark" aria-hidden="true"></span><span id="resultTitleText">压缩完成</span></p>
          <p class="result-meta">文件：<span class="result-filename" id="resultFilename"></span></p>
          <p class="result-meta">大小：<strong id="resultSize"></strong>；尺寸：<span id="resultDimensions"></span></p>
          <div class="result-actions">
            <button class="share-button" id="shareButton" type="button" hidden>保存到手机或分享</button>
            <a class="download-link" id="downloadAgain" href="#" download>再次下载</a>
          </div>
          <p class="result-note">若浏览器因已有同名文件而加上“(1)”，请删除旧文件后再下载，确保文件名只有身份证号。</p>
        </div>

        <div class="help-box" role="note">
          <strong>照片选不上？</strong> 部分电脑浏览器不识别手机的 HEIC/HEIF 格式，可先在手机里截屏，再选择生成的 JPG/PNG 图片。
        </div>
      </section>
    </main>

    <footer class="footer">离线单文件工具 · 不联网 · 不留存个人信息</footer>
    <noscript><div class="noscript">浏览器未开启 JavaScript，无法压缩照片。请换用 Edge、Chrome 或 Safari 打开。</div></noscript>
  </div>

  <canvas id="workCanvas" hidden></canvas>

  <script>
    (() => {
      "use strict";

      // 195 KiB = 199,680 bytes，低于采用十进制计算的 200 KB，给上传系统留安全余量。
      const TARGET_BYTES = 195 * 1024;
      const MAX_INPUT_BYTES = 50 * 1024 * 1024;
      const MAX_LONG_EDGE = 1600;
      const MIN_QUALITY = 0.42;
      const MAX_QUALITY = 0.94;

      const idInput = document.getElementById("idNumber");
      const idHint = document.getElementById("idHint");
      const fileInput = document.getElementById("photoInput");
      const uploadBox = document.getElementById("uploadBox");
      const previewCard = document.getElementById("previewCard");
      const previewImage = document.getElementById("previewImage");
      const fileName = document.getElementById("fileName");
      const fileDetail = document.getElementById("fileDetail");
      const replaceButton = document.getElementById("replaceButton");
      const compressButton = document.getElementById("compressButton");
      const alertBox = document.getElementById("alertBox");
      const resultCard = document.getElementById("resultCard");
      const resultTitleText = document.getElementById("resultTitleText");
      const resultFilename = document.getElementById("resultFilename");
      const resultSize = document.getElementById("resultSize");
      const resultDimensions = document.getElementById("resultDimensions");
      const shareButton = document.getElementById("shareButton");
      const downloadAgain = document.getElementById("downloadAgain");
      const workCanvas = document.getElementById("workCanvas");

      let selectedFile = null;
      let previewUrl = "";
      let resultUrl = "";
      let resultFile = null;
      let busy = false;
      let idTouched = false;

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes < 0) return "未知";
        if (bytes < 1024) return `${bytes} B`;
        return `${(bytes / 1024).toFixed(1)} KB`;
      }

      function normalizeId(value) {
        return value
          .toUpperCase()
          .replace(/[\s-]+/g, "")
          .replace(/[^0-9X]/g, "")
          .slice(0, 18);
      }

      function validateIdCard(value) {
        if (!value) return { valid: false, message: "请输入孩子的 18 位身份证号。" };
        if (value.length < 18) return { valid: false, message: `还需输入 ${18 - value.length} 位。` };
        if (!/^\d{17}[0-9X]$/.test(value)) return { valid: false, message: "身份证号格式不正确：前 17 位应为数字，末位可以是数字或 X。" };
        if (/^0{6}/.test(value)) return { valid: false, message: "身份证号前 6 位地区码不正确，请核对。" };

        const birth = value.slice(6, 14);
        const year = Number(birth.slice(0, 4));
        const month = Number(birth.slice(4, 6));
        const day = Number(birth.slice(6, 8));
        const birthDate = new Date(Date.UTC(year, month - 1, day));
        const today = new Date();
        const dateMatches = birthDate.getUTCFullYear() === year
          && birthDate.getUTCMonth() === month - 1
          && birthDate.getUTCDate() === day;
        const isFuture = birthDate.getTime() > Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());

        if (!dateMatches || year < 1900 || isFuture) {
          return { valid: false, message: "身份证号中的出生日期不正确，请核对。" };
        }

        if (value.slice(14, 17) === "000") {
          return { valid: false, message: "身份证号顺序码不正确，请核对。" };
        }

        const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
        const checks = ["1", "0", "X", "9", "8", "7", "6", "5", "4", "3", "2"];
        const sum = weights.reduce((total, weight, index) => total + Number(value[index]) * weight, 0);
        if (checks[sum % 11] !== value[17]) {
          return { valid: false, message: "身份证号校验位不正确，请逐位核对。" };
        }

        return { valid: true, message: "身份证号格式正确，文件将按此号码命名。" };
      }

      function setIdHint(forceError = false) {
        const result = validateIdCard(idInput.value);
        const showError = idTouched || forceError || idInput.value.length === 18;
        idInput.setAttribute("aria-invalid", String(!result.valid && showError));
        idHint.className = "field-hint";

        if (result.valid) {
          idHint.textContent = result.message;
          idHint.classList.add("is-valid");
        } else if (showError) {
          idHint.textContent = result.message;
          idHint.classList.add("is-error");
        } else {
          idHint.textContent = idInput.value ? result.message : "下载后的文件名将是：身份证号.jpg";
        }

        return result.valid;
      }

      function setAlert(message = "", type = "info") {
        alertBox.textContent = message;
        alertBox.className = "alert";
        if (message) alertBox.classList.add("is-visible", type === "error" ? "is-error" : "is-info");
      }

      function clearResult() {
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = "";
        resultFile = null;
        resultCard.classList.remove("is-visible");
        shareButton.hidden = true;
        downloadAgain.removeAttribute("href");
      }

      function updateActionState() {
        const idValid = validateIdCard(idInput.value).valid;
        const ready = idValid && selectedFile && previewImage.complete && previewImage.naturalWidth > 0 && !busy;
        compressButton.disabled = !ready;

        if (busy) {
          compressButton.textContent = "正在压缩，请稍候…";
        } else if (!idValid && !selectedFile) {
          compressButton.textContent = "请先填写身份证号并选择照片";
        } else if (!idValid) {
          compressButton.textContent = "请先核对身份证号";
        } else if (!selectedFile) {
          compressButton.textContent = "请先选择证件照";
        } else {
          compressButton.textContent = "压缩照片（自动按身份证号命名）";
        }
      }

      function waitForImage(image) {
        return new Promise((resolve, reject) => {
          if (image.complete && image.naturalWidth > 0) {
            resolve();
            return;
          }
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", () => reject(new Error("浏览器无法读取这张照片。")), { once: true });
        });
      }

      async function useFile(file) {
        setAlert();
        clearResult();

        if (!file) return;
        if (file.size > MAX_INPUT_BYTES) {
          selectedFile = null;
          setAlert("照片超过 50MB，请先在相册中裁剪或截屏后再试。", "error");
          updateActionState();
          return;
        }

        const looksLikeImage = file.type.startsWith("image/") || /\.(jpe?g|png|webp|bmp|heic|heif)$/i.test(file.name);
        if (!looksLikeImage) {
          selectedFile = null;
          setAlert("请选择照片文件，不要选择 Word、PDF 或压缩包。", "error");
          updateActionState();
          return;
        }

        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);
        previewImage.removeAttribute("src");
        previewImage.src = previewUrl;

        try {
          await waitForImage(previewImage);
          selectedFile = file;
          fileName.textContent = file.name || "已选择照片";
          fileDetail.textContent = `原图 ${formatBytes(file.size)} · ${previewImage.naturalWidth} × ${previewImage.naturalHeight} 像素`;
          previewCard.classList.add("is-visible");
          uploadBox.style.display = "none";
        } catch (error) {
          selectedFile = null;
          previewCard.classList.remove("is-visible");
          uploadBox.style.display = "grid";
          setAlert("浏览器无法读取这张照片。若为 HEIC/HEIF，请先截屏或转换成 JPG 后再选择。", "error");
        }

        updateActionState();
      }

      function canvasToJpeg(canvas, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("浏览器生成 JPG 失败，请换用 Edge、Chrome 或 Safari。"));
          }, "image/jpeg", quality);
        });
      }

      function drawImageAtSize(source, width, height) {
        workCanvas.width = width;
        workCanvas.height = height;
        const context = workCanvas.getContext("2d", { alpha: false });
        if (!context) throw new Error("浏览器无法创建图片画布。请关闭其他大型应用后重试。");
        context.save();
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.drawImage(source, 0, 0, width, height);
        context.restore();
      }

      async function findBestJpegForCurrentSize() {
        const highBlob = await canvasToJpeg(workCanvas, MAX_QUALITY);
        if (highBlob.size <= TARGET_BYTES) {
          return { blob: highBlob, quality: MAX_QUALITY };
        }

        const lowBlob = await canvasToJpeg(workCanvas, MIN_QUALITY);
        if (lowBlob.size > TARGET_BYTES) return null;

        let bestBlob = lowBlob;
        let bestQuality = MIN_QUALITY;
        let low = MIN_QUALITY;
        let high = MAX_QUALITY;

        for (let attempt = 0; attempt < 9; attempt += 1) {
          const quality = (low + high) / 2;
          const blob = await canvasToJpeg(workCanvas, quality);
          if (blob.size <= TARGET_BYTES) {
            bestBlob = blob;
            bestQuality = quality;
            low = quality;
          } else {
            high = quality;
          }
        }

        return { blob: bestBlob, quality: bestQuality };
      }

      async function compressPhoto(source) {
        const sourceWidth = source.naturalWidth;
        const sourceHeight = source.naturalHeight;
        if (!sourceWidth || !sourceHeight) throw new Error("无法读取照片尺寸，请重新选择照片。");

        const initialScale = Math.min(1, MAX_LONG_EDGE / Math.max(sourceWidth, sourceHeight));
        let width = Math.max(1, Math.round(sourceWidth * initialScale));
        let height = Math.max(1, Math.round(sourceHeight * initialScale));

        for (let pass = 0; pass < 16; pass += 1) {
          drawImageAtSize(source, width, height);
          const encoded = await findBestJpegForCurrentSize();
          if (encoded && encoded.blob.size <= TARGET_BYTES) {
            return {
              blob: encoded.blob,
              width,
              height,
              quality: encoded.quality
            };
          }

          const nextWidth = Math.max(160, Math.floor(width * 0.84));
          const nextHeight = Math.max(160, Math.floor(height * 0.84));
          if (nextWidth === width && nextHeight === height) break;
          width = nextWidth;
          height = nextHeight;
        }

        throw new Error("这张照片内容过于复杂，未能安全压到 200KB 以下。请先裁剪照片边缘后再试。");
      }

      function prepareDownload(blob, filename) {
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = URL.createObjectURL(blob);
        resultFile = new File([blob], filename, { type: "image/jpeg" });
        downloadAgain.href = resultUrl;
        downloadAgain.download = filename;

        let canShare = false;
        try {
          canShare = typeof navigator.share === "function"
            && typeof navigator.canShare === "function"
            && navigator.canShare({ files: [resultFile] });
          shareButton.hidden = !canShare;
        } catch {
          shareButton.hidden = true;
        }

        if (!canShare) {
          const temporaryLink = document.createElement("a");
          temporaryLink.href = resultUrl;
          temporaryLink.download = filename;
          temporaryLink.style.display = "none";
          document.body.appendChild(temporaryLink);
          temporaryLink.click();
          temporaryLink.remove();
        }

        return canShare;
      }

      shareButton.addEventListener("click", async () => {
        if (!resultFile || typeof navigator.share !== "function") return;
        try {
          await navigator.share({
            files: [resultFile],
            title: "孩子证件照"
          });
        } catch (error) {
          if (!(error instanceof DOMException && error.name === "AbortError")) {
            setAlert("手机分享未成功，请点击“再次下载”保存照片。", "error");
          }
        }
      });

      idInput.addEventListener("input", () => {
        const normalized = normalizeId(idInput.value);
        if (idInput.value !== normalized) idInput.value = normalized;
        setIdHint();
        clearResult();
        setAlert();
        updateActionState();
      });

      idInput.addEventListener("blur", () => {
        idTouched = true;
        setIdHint();
      });

      fileInput.addEventListener("change", () => {
        useFile(fileInput.files && fileInput.files[0]);
      });

      replaceButton.addEventListener("click", () => fileInput.click());

      ["dragenter", "dragover"].forEach((eventName) => {
        uploadBox.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadBox.classList.add("is-dragging");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        uploadBox.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadBox.classList.remove("is-dragging");
        });
      });

      uploadBox.addEventListener("drop", (event) => {
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        useFile(file);
      });

      compressButton.addEventListener("click", async () => {
        idTouched = true;
        const idValid = setIdHint(true);
        if (!idValid) {
          idInput.focus();
          updateActionState();
          return;
        }
        if (!selectedFile) {
          setAlert("请先选择孩子的证件照。", "error");
          fileInput.focus();
          return;
        }

        const validatedId = idInput.value;
        busy = true;
        idInput.disabled = true;
        fileInput.disabled = true;
        replaceButton.disabled = true;
        clearResult();
        setAlert("正在压缩照片，请不要关闭页面…", "info");
        compressButton.classList.add("is-busy");
        updateActionState();

        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        try {
          const result = await compressPhoto(previewImage);
          const outputName = `${validatedId}.jpg`;
          const requiresSaveTap = prepareDownload(result.blob, outputName);
          resultTitleText.textContent = requiresSaveTap
            ? "压缩完成，请保存照片"
            : "压缩完成，照片已开始下载";
          resultFilename.textContent = outputName;
          resultSize.textContent = formatBytes(result.blob.size);
          resultDimensions.textContent = `${result.width} × ${result.height} 像素`;
          resultCard.classList.add("is-visible");
          setAlert();
          resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (error) {
          const message = error instanceof Error ? error.message : "压缩失败，请重新选择照片后再试。";
          setAlert(message, "error");
        } finally {
          busy = false;
          idInput.disabled = false;
          fileInput.disabled = false;
          replaceButton.disabled = false;
          compressButton.classList.remove("is-busy");
          updateActionState();
        }
      });

      window.addEventListener("beforeunload", () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        if (resultUrl) URL.revokeObjectURL(resultUrl);
      });

      setIdHint();
      updateActionState();
    })();
  </script>
</body>
</html>
